services:
  - type: web
    name: saqf-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix apps/api && npm run build --prefix apps/api
    startCommand: npm start --prefix apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

  - type: web
    name: saqf-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix apps/web && npm run build --prefix apps/web
    startCommand: npm start --prefix apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://saqf-api.onrender.com
